<!DOCTYPE html>
<!--
  gallery.html: every finished session as a small still plant.
  Each thumbnail is its own p5 instance drawn with the same drawPlant
  function as the live garden. Click one to open its full summary.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Garden: gallery</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F4F1EA; color: #2B2B2B; margin: 0; padding: 20px 16px; }
    h1 { color: #2E7D32; font-size: 24px; margin: 0 0 4px; }
    .hint { color: #5A5A5A; font-size: 14px; margin: 0 0 16px; }
    #gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, 196px); gap: 16px; }
    .thumbnail { background: #FFFFFF; border-radius: 10px; padding: 8px; cursor: pointer; border: 2px solid transparent; }
    .thumbnail:hover { border-color: #2E7D32; }
    .thumbnail canvas { display: block; border-radius: 6px; }
    .thumbnail-task { font-weight: 600; font-size: 14px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thumbnail-date { color: #5A5A5A; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Your garden</h1>
  <p class="hint">Every finished session, newest first. Click a plant to see its summary.</p>
  <div id="gallery-grid"></div>
  <script src="../lib/p5.min.js"></script>
  <script src="../shared/rules.js"></script>
  <script src="../shared/variation.js"></script>
  <script src="../shared/plant.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
