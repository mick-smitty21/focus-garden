<!DOCTYPE html>
<!--
  garden.html: the page where the plant is drawn.
  It loads p5.js from the local lib folder (never from the internet),
  then garden.js, which creates a p5 sketch inside the #garden-canvas div.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Garden</title>
  <link rel="stylesheet" href="garden.css">
</head>
<body>
  <h1>Focus Garden</h1>
  <div id="garden-canvas"></div>
  <script src="../lib/p5.min.js"></script>
  <script src="garden.js"></script>
</body>
</html>
