<!DOCTYPE html>
<!--
  garden.html: the live garden window that sits beside your work.
  Loads p5.js (local), the shared rules and plant code, then garden.js,
  which draws the plant and the status lines under it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Garden</title>
  <link rel="stylesheet" href="garden.css">
</head>
<body>
  <div id="garden-canvas"></div>
  <div id="info">
    <div class="info-row">
      <span id="task-name"></span>
      <span id="demo-tag" hidden>DEMO MODE 10x</span>
    </div>
    <div class="info-row">
      <span id="state-words"></span>
      <span id="time-remaining"></span>
    </div>
  </div>
  <script src="../lib/p5.min.js"></script>
  <script src="../shared/rules.js"></script>
  <script src="../shared/plant.js"></script>
  <script src="garden.js"></script>
</body>
</html>
